version: '3.8'

services:
  php:
    image: php:8.1-fpm
    container_name: laravel_php
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/mysql

  nginx:
    image: nginx:latest
    container_name: laravel_nginx
    depends_on:
      - php
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx:/etc/nginx/conf.d
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data: